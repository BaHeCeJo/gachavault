services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gachavault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gachavault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gachavault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RUST_LOG: info
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3009}
      AUTH_SERVICE_URL: http://auth-service:3001
      GAMES_SERVICE_URL: http://games-service:3002
      ITEMS_SERVICE_URL: http://items-service:3003
      COLLECTIONS_SERVICE_URL: http://collections-service:3004
      TIERLISTS_SERVICE_URL: http://tierlists-service:3005
      MEDIA_SERVICE_URL: http://media-service:3006
      SEARCH_SERVICE_URL: http://search-service:3007
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3008
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      games-service:
        condition: service_started
      items-service:
        condition: service_started
      collections-service:
        condition: service_started
      tierlists-service:
        condition: service_started
      media-service:
        condition: service_started
      search-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_SECONDS: 900
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3009}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3008
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  games-service:
    build:
      context: .
      dockerfile: services/games-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  items-service:
    build:
      context: .
      dockerfile: services/items-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      JWT_SECRET: ${JWT_SECRET}
      SEARCH_SERVICE_URL: http://search-service:3007
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  collections-service:
    build:
      context: .
      dockerfile: services/collections-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  tierlists-service:
    build:
      context: .
      dockerfile: services/tierlists-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      RUST_LOG: info
      DATABASE_URL: postgres://gachavault:${POSTGRES_PASSWORD}@postgres:5432/gachavault
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      PUBLIC_BASE_URL: ${BACKEND_URL:-http://localhost:3006}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      RUST_LOG: info
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      - meilisearch

  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    ports:
      - "3008:3008"
    depends_on:
      - mailhog
    environment:
      PORT: 3008
      RUST_LOG: info
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@gachavault.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3009}
      INTERNAL_SECRET: ${INTERNAL_SECRET}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    environment:
      # NEXT_PUBLIC_API_URL is the browser-side URL (baked into client JS).
      # INTERNAL_API_URL is what Next uses for SSR / sitemap / generateMetadata
      # — inside compose, that's the api-gateway service hostname.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      INTERNAL_API_URL: http://api-gateway:3000
      PORT: 3009
    depends_on:
      - api-gateway

  db-backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/db-backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: gachavault
      PGDATABASE: gachavault
      KEEP_DAYS: 7
      BACKUP_INTERVAL: 86400
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  media_uploads:
  db_backups:
