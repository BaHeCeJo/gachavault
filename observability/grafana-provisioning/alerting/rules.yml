apiVersion: 1

# Alert rules backed by Loki LogQL queries. The Grafana evaluator runs
# each query on the `interval` cadence and fires an alert when the
# `for` window has been continuously over threshold.
#
# Limitations:
#   - We're log-based, so anything that doesn't surface in logs (CPU,
#     memory, disk free, network) isn't covered here — that needs
#     node_exporter + Prometheus, not on this stack.
#   - Disk pressure on /loki and /postgres_data shows up as service
#     crash logs eventually, which the "service panic" rule below catches
#     after the fact.

groups:
  - orgId: 1
    name: gachavault
    folder: gachavault
    interval: 1m
    rules:

      # Any Rust service panicked in the last 5 minutes. Rust panics print
      # "panicked at" with backtrace info; restart loops re-emit it on
      # every cycle so this fires within a minute of the first crash.
      #
      # The container!~ clause excludes the observability stack: Loki logs
      # every LogQL query it runs (including THIS one), and that log line
      # contains the literal "panicked at" from the query text. Promtail
      # ships Loki's own logs back into Loki, so without the exclusion the
      # alert matches its own query echo and self-fires forever. Grafana
      # (which evaluates the rule) can echo the query too. Excluding these
      # keeps every real app/infra panic (meilisearch included) in scope.
      - uid: service-panic
        title: Service panicked
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container=~"gachavault-.*", container!~"gachavault-(loki|grafana|promtail).*"} |~ "(?i)panicked at" [5m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A gachavault-* container logged a panic
          description: "Check `docker logs <container>` and the Loki stream {container=\"...\"} |~ \"panicked at\""

      # 5xx error rate spike from nginx. Threshold 10 errors / 5 min is a
      # rough heuristic — tune after a week of baseline data. Catches both
      # backend outages (502/504) and unhandled handler errors (500).
      - uid: nginx-5xx-spike
        title: nginx 5xx spike
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container=~".*nginx.*"} |~ " 5[0-9][0-9] " [5m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: nginx returned more than 10 5xx responses in 5 minutes
          description: "Drill into {container=~\".*nginx.*\"} |~ \" 5[0-9][0-9] \" to find which path is failing"

      # Postgres logged a FATAL or PANIC. These mean the DB itself is in a
      # bad place (out of memory, corrupt page, can't write WAL) — the
      # services will start failing within seconds.
      - uid: postgres-fatal
        title: Postgres FATAL/PANIC
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({service="postgres"} |~ "(?i)\\b(fatal|panic)\\b" [5m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Postgres logged a FATAL or PANIC message
          description: "Check `docker logs postgres` immediately"

      # Certbot renewal printed its loud failure marker.
      # db-backup.sh prints `[certbot] renew FAILED at ...` on failure,
      # the cert healthcheck flips unhealthy at 7 days to expiry; this
      # rule catches the earlier signal so we have time to intervene.
      - uid: certbot-renew-failed
        title: certbot renew failed
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container=~".*certbot.*"} |~ "renew FAILED" [24h]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: certbot has logged a renewal failure in the last 24h
          description: "Investigate before the cert hits the 7-day expiry healthcheck threshold"

      # No successful DB backup recently. scripts/db-backup.sh prints
      # `[backup] Saved` only after a complete pg_dump (pipefail guards
      # against the empty-dump case, where it logs a FAILED line and deletes
      # the partial file instead). Absence of `Saved` for 48h means the daily
      # backup is broken (crash-loop, auth failure, disk full) and the
      # on-VPS backups are stale. Uses |= (literal) not |~ because the match
      # contains regex metacharacters ([ ]). Local backups only by design —
      # this does NOT cover off-site, which we intentionally don't run.
      - uid: db-backup-stale
        title: Database backup hasn't succeeded in 48h
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 172800, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container=~".*db-backup.*"} |= "[backup] Saved" [48h]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No successful database backup logged in the last 48 hours
          description: "db-backup hasn't logged `[backup] Saved` in 48h — the daily pg_dump is failing. Check `docker logs gachavault-db-backup-1`. The on-VPS backups under the db_backups volume are now stale."

      # ── Resource alerts (Prometheus / node-exporter) ────────────────────────
      # These query Prometheus, not Loki. Mirrored in auth-service monitoring.rs
      # (RuleDef { prometheus: true }) so the in-app alerts panel shows them too.

      # Root filesystem above 85% full. Disk fills slowly on a single VPS so a
      # 5m `for` is plenty; gives days of lead time before it gets critical.
      - uid: disk-high
        title: Disk usage above 85%
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"})) * 100'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Root filesystem is over 85% full
          description: "Disk on / is above 85%. Prune docker images/volumes or old backups before it fills — `df -h /` and `docker system df`."

      # Host memory above 90% used (MemAvailable < 10%).
      - uid: ram-high
        title: Memory usage above 90%
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host memory is over 90% used
          description: "Available memory under 10%. Check the per-container breakdown on /admin/monitoring for the culprit."

      # CPU above 90% averaged over 10m (rate window) AND sustained for 10m, so
      # normal short bursts (a deploy, a backup) don't trip it.
      - uid: cpu-high
        title: CPU usage above 90% (10m)
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[10m])) * 100)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CPU above 90% sustained for 10 minutes
          description: "Sustained high CPU. Check per-container CPU on /admin/monitoring or the cAdvisor dashboard in Grafana."
