# Prometheus scrape config for the GachaVault VPS. Metrics only — logs are
# handled by Loki/Promtail. Scraped targets resolve over the `internal` compose
# network. Edit + `curl -X POST http://prometheus:9090/-/reload` (from inside the
# net) or `--force-recreate prometheus` to apply changes (single-file bind mount).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics: CPU, RAM, disk, network, load.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Per-container metrics: CPU, memory, network per running container.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
