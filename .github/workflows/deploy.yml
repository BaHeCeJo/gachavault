name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
          - name: games-service
            dockerfile: services/games-service/Dockerfile
          - name: items-service
            dockerfile: services/items-service/Dockerfile
          - name: collections-service
            dockerfile: services/collections-service/Dockerfile
          - name: tierlists-service
            dockerfile: services/tierlists-service/Dockerfile
          - name: media-service
            dockerfile: services/media-service/Dockerfile
          - name: search-service
            dockerfile: services/search-service/Dockerfile
          - name: notifications-service
            dockerfile: services/notifications-service/Dockerfile
          - name: web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.name == 'web' && 'web' || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BaHeCeJo/gachavault
          build-args: |
            ${{ matrix.service.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', secrets.BACKEND_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          # mode=max exports every intermediate layer, which fills the GHA
          # cache quota (10 GB total across all caches) in only a handful of
          # builds across 10 services. mode=min exports only the final stage
          # — cuts cache size by ~5–10x and cuts the cache-export step time
          # too. Speed difference on actual builds is negligible since the
          # things rebuilt across pushes are the source layers, not the deps.
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=min
          # Skip the SLSA provenance attestation; we're not consuming it
          # downstream and it adds 30–60s per service push.
          provenance: false

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          # Commit SHA of this push — used to pin every gachavault-* image
          # tag below so what we just built is exactly what gets deployed.
          # Without this, compose would pull `:latest`, which is racy against
          # any concurrent build/push (and is the standard supply-chain
          # concern of mutable tags).
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin
            export GHCR_OWNER=$(echo "$GHCR_ACTOR" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG
            cd /opt/gachavault

            git pull origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Ensure every Docker-secret file referenced by docker-compose.prod.yml
            # exists before `up -d`. Without this, adding a new secret to compose
            # (e.g. grafana_admin_password) fails the entire recreate with
            # 'bind source path does not exist' and leaves containers half-stopped.
            # The script is idempotent — existing secret files are skipped, only
            # missing ones are created (with auto-generated values where possible).
            # No sudo: VPS_USER is root per DEPLOY.md, so this runs as root anyway.
            bash scripts/migrate-env-to-secrets.sh /opt/gachavault/.env

            # One-time (now idempotent) fix for the media_uploads volume:
            # earlier images ran media-service as root, so existing files are
            # owned by uid 0. The current image runs as uid 10000, which can't
            # write to a root-owned dir. We chown the volume to 10000 before
            # the new container starts. Doing this every deploy is harmless —
            # a no-op when ownership is already correct.
            MEDIA_VOLUME=$(docker volume ls -q --filter name=media_uploads | head -1 || true)
            if [ -n "$MEDIA_VOLUME" ]; then
              docker run --rm -v "$MEDIA_VOLUME":/uploads alpine \
                chown -R 10000:10000 /uploads
            fi

            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull
            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Force-recreate nginx so it picks up nginx.conf changes.
            # nginx.conf is bind-mounted as a single file, and `git pull`
            # replaces the file (new inode) rather than modifying it in place,
            # so the existing container keeps the old content even after
            # `nginx -s reload`. Full recreate re-resolves the mount.
            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --force-recreate nginx

            # Post-deploy smoke test. We've been bitten three times by
            # smoke tests that were stricter than the actual failure mode
            # we care about — false positives (bot mitigation returning
            # 403 to the GitHub runner IP; the gateway not exposing the
            # endpoint we polled) caused green deploys to register as
            # failures. The bar we actually care about is: nginx is up
            # and routing.
            #
            # So: poll the home page with a real-looking User-Agent and
            # accept ANY 3-digit HTTP code as "nginx is responding". Only
            # fail on connection refused / timeout (curl exits non-zero).
            # If nginx returns 5xx for every request, that's a real
            # problem worth investigating, but it shouldn't block the
            # deploy workflow — operator can read the warning, check
            # docker compose ps, and fix forward.
            echo "[smoke] checking nginx is responding..."
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                -A "Mozilla/5.0 (gachavault-deploy-smoke)" \
                https://hotarumi.com/ || echo 000)
              if [ "$code" != "000" ]; then
                echo "[smoke] nginx is responding (attempt $attempt, HTTP $code)"
                if [ "${code:0:1}" = "4" ] || [ "${code:0:1}" = "5" ]; then
                  echo "[smoke] WARN — site responded with HTTP $code; investigate" >&2
                  echo "[smoke] WARN — but not failing the deploy on a status code alone" >&2
                fi
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo "[smoke] FAILED — nginx did not respond after 12 attempts (60s)" >&2
                echo "[smoke] this is a network / TLS / nginx-down failure, not an app failure" >&2
                echo "[smoke] inspect with: docker compose -f docker-compose.prod.yml ps" >&2
                exit 1
              fi
              sleep 5
            done

            # Clean up old images
            docker image prune -f
