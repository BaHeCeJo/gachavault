server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover every Docker container on the host and ship its stdout/stderr to
  # Loki. Labels are derived from compose service name + container name so
  # logs can be filtered like `{service="auth-service"}` in Grafana.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # Rust services log structured JSON via tracing-subscriber. Parse it so
      # fields (level, target, request_id, ...) are queryable in Loki.
      - json:
          expressions:
            level: level
            request_id: request_id
            target: target
      - labels:
          level:
