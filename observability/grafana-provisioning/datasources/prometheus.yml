apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned UID so dashboards/alert rules can reference it stably across
    # Grafana restarts (same reason as the Loki datasource).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
