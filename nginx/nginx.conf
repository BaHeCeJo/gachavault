events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 25M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # TLS session cache
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Compress text-shaped responses. JS/CSS bundles compress 3-4x with gzip;
    # JSON API responses similar. Skip already-compressed types (images, fonts
    # served by Next as woff2, video). gzip_min_length 1000 avoids spending
    # CPU on tiny replies where the overhead outweighs the savings.
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name hotarumi.com www.hotarumi.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hotarumi.com www.hotarumi.com;

        ssl_certificate /etc/letsencrypt/live/hotarumi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hotarumi.com/privkey.pem;

        # Security headers (CSP is set by Next.js; nginx adds the rest)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        # max-age=31536000 (1y) is the floor required for hstspreload.org and
        # gives a more recoverable window than 2y if the TLS setup ever needs
        # to be unwound. Bump back up once the site has been on HTTPS without
        # incident for ~1y.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Stricter rate limit on sensitive auth endpoints
        location /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/register {
            limit_req zone=auth burst=5 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/forgot-password {
            limit_req zone=auth burst=3 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/refresh {
            limit_req zone=auth burst=10 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/me/password {
            limit_req zone=auth burst=5 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API gateway — all other /api/*
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            resolver 127.0.0.11 valid=10s;
            set $gw_upstream http://api-gateway:3000;
            proxy_pass $gw_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded media — served directly by media-service
        location /uploads/ {
            resolver 127.0.0.11 valid=10s;
            set $media_upstream http://media-service:3006;
            proxy_pass $media_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js content-addressed static assets — bundle filenames embed a
        # hash, so the response body for any given URL never changes. Cache
        # for a year and mark immutable so browsers don't even revalidate.
        # MUST sit above the general `location /` so nginx prefers it.
        location /_next/static/ {
            resolver 127.0.0.11 valid=10s;
            set $web_upstream http://web:3009;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Next.js frontend
        location / {
            resolver 127.0.0.11 valid=10s;
            set $web_upstream http://web:3009;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
