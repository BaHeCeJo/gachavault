name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust build & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gachavault
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: gachavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gachavault:cipassword@localhost:5432/gachavault

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run all migrations
        # Globally sort by version prefix (timestamp) and apply with psql.
        # sqlx-cli's per-source `migrate run` was rejecting out-of-order
        # versions across services and was masked by `|| true` — leaving
        # tests to compile against an incomplete schema. All migrations
        # are written with IF NOT EXISTS so direct psql is idempotent.
        run: |
          set -euo pipefail
          for f in $(ls services/*/migrations/*.sql | sort -t/ -k4); do
            echo "==> $f"
            PGPASSWORD=cipassword psql -h localhost -U gachavault -d gachavault -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (all services)
        run: cargo build --workspace --release

      - name: Run tests
        # SQLX_OFFLINE=false so sqlx::test can verify queries against the
        # live CI Postgres (each test gets its own auto-created database).
        env:
          SQLX_OFFLINE: "false"
        run: cargo test --workspace --all-targets

      - name: Security audit (Rust)
        # RUSTSEC-2023-0071: rsa timing side-channel, no fix available.
        # Only reachable via sqlx-mysql (compile-time macro dep); we use PostgreSQL only.
        run: cargo install cargo-audit --quiet && cargo audit --ignore RUSTSEC-2023-0071

  frontend-check:
    name: Next.js build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Security audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true
