name: Deploy to VPS

on:
  push:
    branches: [main]
    # Doc-only and sibling-workflow changes never affect the running site,
    # so don't spend build minutes (or a VPS deploy) on them. A change to
    # deploy.yml itself is NOT ignored — we want to exercise it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/ci.yml"
      - ".github/workflows/clean-cache.yml"
      - ".github/workflows/security-audit.yml"
      - ".github/workflows/ghcr-cleanup.yml"
  workflow_dispatch:

# Serialize deploys per branch. cancel-in-progress is false on purpose: an
# in-flight deploy is mid-SSH on the VPS (compose up, migrations, nginx
# recreate) and must NOT be killed halfway — a superseding push waits its turn.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.detect.outputs.changed_services }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need history back to the previous commit to diff against it.
          fetch-depth: 0

      - name: Detect which services changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-changed-services.sh

  build-and-push:
    name: Build/retag ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: write

    strategy:
      # Don't let one service's failure cancel the siblings — we want every
      # service to end up with a :<sha> image (built or retagged) so the
      # SHA-pinned deploy has a complete set. A real failure still fails the
      # job, which gates the deploy below.
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
          - name: games-service
            dockerfile: services/games-service/Dockerfile
          - name: items-service
            dockerfile: services/items-service/Dockerfile
          - name: collections-service
            dockerfile: services/collections-service/Dockerfile
          - name: tierlists-service
            dockerfile: services/tierlists-service/Dockerfile
          - name: media-service
            dockerfile: services/media-service/Dockerfile
          - name: search-service
            dockerfile: services/search-service/Dockerfile
          - name: notifications-service
            dockerfile: services/notifications-service/Dockerfile
          - name: web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - name: Set image owner (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Decide build vs retag
        id: decide
        env:
          CHANGED: ${{ needs.changes.outputs.changed_services }}
          SVC: ${{ matrix.service.name }}
        run: |
          # Build this service if the detector said ALL, or named it explicitly.
          if [ "$CHANGED" = "ALL" ] || echo " $CHANGED " | grep -q " $SVC "; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "[$SVC] -> BUILD"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "[$SVC] -> retag :latest -> :${{ github.sha }} (unchanged)"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service.name }}
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.name == 'web' && 'web' || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BaHeCeJo/gachavault
          build-args: |
            ${{ matrix.service.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', secrets.BACKEND_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          # mode=max exports every intermediate layer, which fills the GHA
          # cache quota (10 GB total across all caches) in only a handful of
          # builds across 10 services. mode=min exports only the final stage
          # — cuts cache size by ~5–10x and cuts the cache-export step time
          # too. Speed difference on actual builds is negligible since the
          # things rebuilt across pushes are the source layers, not the deps.
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=min
          # Skip the SLSA provenance attestation; we're not consuming it
          # downstream and it adds 30–60s per service push.
          provenance: false

      - name: Retag :latest -> :sha (unchanged service)
        if: steps.decide.outputs.build == 'false'
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}
        run: |
          # Registry-side manifest copy — no pull, no build, a few seconds.
          # The unchanged service is already running this exact image; we just
          # give it the new :<sha> tag so the SHA-pinned compose deploy below
          # finds an image for every service. :latest is left untouched (it
          # already points at the most recent build of this service).
          docker buildx imagetools create --tag "$IMG:${{ github.sha }}" "$IMG:latest"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          # Commit SHA of this push — used to pin every gachavault-* image
          # tag below so what we just built is exactly what gets deployed.
          # Without this, compose would pull `:latest`, which is racy against
          # any concurrent build/push (and is the standard supply-chain
          # concern of mutable tags).
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin
            export GHCR_OWNER=$(echo "$GHCR_ACTOR" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG
            cd /opt/gachavault

            # Remember the currently-deployed tag so we can auto-roll back if
            # the new images don't come up healthy. This file is updated only
            # at the very end, after both health gates pass, so it always
            # points at a deploy that actually came up (see end of script).
            PREV_TAG=$(cat /opt/gachavault/.deployed_sha 2>/dev/null || echo "")
            echo "[deploy] new tag=$IMAGE_TAG  previous-healthy tag=${PREV_TAG:-<none>}"

            git pull origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Ensure every Docker-secret file referenced by docker-compose.prod.yml
            # exists before `up -d`. Without this, adding a new secret to compose
            # (e.g. grafana_admin_password) fails the entire recreate with
            # 'bind source path does not exist' and leaves containers half-stopped.
            # The script is idempotent — existing secret files are skipped, only
            # missing ones are created (with auto-generated values where possible).
            # No sudo: VPS_USER is root per DEPLOY.md, so this runs as root anyway.
            bash scripts/migrate-env-to-secrets.sh /opt/gachavault/.env

            # One-time (now idempotent) fix for the media_uploads volume:
            # earlier images ran media-service as root, so existing files are
            # owned by uid 0. The current image runs as uid 10000, which can't
            # write to a root-owned dir. We chown the volume to 10000 before
            # the new container starts. Doing this every deploy is harmless —
            # a no-op when ownership is already correct.
            MEDIA_VOLUME=$(docker volume ls -q --filter name=media_uploads | head -1 || true)
            if [ -n "$MEDIA_VOLUME" ]; then
              docker run --rm -v "$MEDIA_VOLUME":/uploads alpine \
                chown -R 10000:10000 /uploads
            fi

            # Pull ONLY the app images — they all come from GHCR, which we
            # authenticated to above. A bare `docker compose pull` ALSO pulls
            # every third-party base image (nginx, postgres, redis, grafana,
            # loki, prometheus, …) from Docker Hub ANONYMOUSLY, which hits the
            # 100-pulls/6h-per-IP limit and aborts the whole deploy with HTTP
            # 429 (set -e) before anything is recreated. Those base images are
            # already on the VPS and rarely change; the `up -d` below re-pulls
            # any that are genuinely missing (compose pull policy "missing").
            # Keep APP_SERVICES in sync with the health gate / rollback below.
            APP_SERVICES="api-gateway auth-service games-service items-service collections-service tierlists-service media-service search-service notifications-service web"
            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull $APP_SERVICES
            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Force-recreate nginx so it picks up nginx.conf changes.
            # nginx.conf is bind-mounted as a single file, and `git pull`
            # replaces the file (new inode) rather than modifying it in place,
            # so the existing container keeps the old content even after
            # `nginx -s reload`. Full recreate re-resolves the mount.
            GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --force-recreate nginx

            # --- Health gate: wait for the app containers to come up healthy.
            # The nginx smoke test below only proves nginx is routing; it does
            # NOT catch a backend service that's crash-looping behind it. This
            # gate inspects each app container's actual state/health and, if any
            # fail to come up within the window, auto-rolls back to PREV_TAG.
            #
            # notifications-service has no healthcheck, so "running" alone is
            # treated as healthy for services without one. A container that's
            # exited/dead/unhealthy, or still restarting/starting at the end of
            # the window, counts as a failed deploy.
            HEALTHY=0
            bad=""; pending=""
            for attempt in $(seq 1 36); do
              bad=""; pending=""
              for svc in $APP_SERVICES; do
                cid=$(docker compose -f docker-compose.prod.yml ps -q "$svc" 2>/dev/null || true)
                if [ -z "$cid" ]; then pending="$pending $svc(no-container)"; continue; fi
                status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo unknown)
                health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo none)
                case "$status" in
                  running)
                    case "$health" in
                      healthy|none) : ;;
                      starting) pending="$pending $svc(starting)" ;;
                      *) bad="$bad $svc(unhealthy)" ;;
                    esac ;;
                  restarting|created) pending="$pending $svc($status)" ;;
                  *) bad="$bad $svc($status)" ;;
                esac
              done
              if [ -z "$bad" ] && [ -z "$pending" ]; then HEALTHY=1; break; fi
              echo "[health] attempt $attempt/36 — pending:[$pending ] bad:[$bad ]"
              sleep 5
            done

            if [ "$HEALTHY" != 1 ]; then
              echo "[health] FAILED — app services not healthy after ~180s" >&2
              echo "[health]   bad:[$bad ] pending:[$pending ]" >&2
              docker compose -f docker-compose.prod.yml ps >&2 || true
              if [ -n "$PREV_TAG" ]; then
                echo "[rollback] reverting app services to previous healthy tag $PREV_TAG" >&2
                GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$PREV_TAG docker compose -f docker-compose.prod.yml pull $APP_SERVICES || true
                GHCR_OWNER=$GHCR_OWNER IMAGE_TAG=$PREV_TAG docker compose -f docker-compose.prod.yml up -d --force-recreate $APP_SERVICES
                echo "[rollback] done — app services restored to $PREV_TAG (failed tag was $IMAGE_TAG)" >&2
                echo "[rollback] NOTE: migrations run on container boot and are FORWARD-ONLY — they were NOT reverted." >&2
                echo "[rollback] If the failure was a bad migration, a code rollback may be schema-incompatible; fix forward." >&2
              else
                echo "[rollback] no previously-recorded healthy tag — cannot auto-roll back; fix forward." >&2
              fi
              exit 1
            fi
            echo "[health] all app services healthy"

            # Post-deploy smoke test. We've been bitten three times by
            # smoke tests that were stricter than the actual failure mode
            # we care about — false positives (bot mitigation returning
            # 403 to the GitHub runner IP; the gateway not exposing the
            # endpoint we polled) caused green deploys to register as
            # failures. The bar we actually care about is: nginx is up
            # and routing.
            #
            # So: poll the home page with a real-looking User-Agent and
            # accept ANY 3-digit HTTP code as "nginx is responding". Only
            # fail on connection refused / timeout (curl exits non-zero).
            # If nginx returns 5xx for every request, that's a real
            # problem worth investigating, but it shouldn't block the
            # deploy workflow — operator can read the warning, check
            # docker compose ps, and fix forward.
            echo "[smoke] checking nginx is responding..."
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                -A "Mozilla/5.0 (gachavault-deploy-smoke)" \
                https://hotarumi.com/ || echo 000)
              if [ "$code" != "000" ]; then
                echo "[smoke] nginx is responding (attempt $attempt, HTTP $code)"
                if [ "${code:0:1}" = "4" ] || [ "${code:0:1}" = "5" ]; then
                  echo "[smoke] WARN — site responded with HTTP $code; investigate" >&2
                  echo "[smoke] WARN — but not failing the deploy on a status code alone" >&2
                fi
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo "[smoke] FAILED — nginx did not respond after 12 attempts (60s)" >&2
                echo "[smoke] this is a network / TLS / nginx-down failure, not an app failure" >&2
                echo "[smoke] inspect with: docker compose -f docker-compose.prod.yml ps" >&2
                exit 1
              fi
              sleep 5
            done

            # Both gates passed — record this tag as the new known-good
            # rollback target for the next deploy, then prune. (Written here,
            # last, so PREV_TAG never points at a deploy that didn't come up.)
            echo "$IMAGE_TAG" > /opt/gachavault/.deployed_sha

            # Clean up old images
            docker image prune -f
