name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
          - name: games-service
            dockerfile: services/games-service/Dockerfile
          - name: items-service
            dockerfile: services/items-service/Dockerfile
          - name: collections-service
            dockerfile: services/collections-service/Dockerfile
          - name: tierlists-service
            dockerfile: services/tierlists-service/Dockerfile
          - name: media-service
            dockerfile: services/media-service/Dockerfile
          - name: search-service
            dockerfile: services/search-service/Dockerfile
          - name: notifications-service
            dockerfile: services/notifications-service/Dockerfile
          - name: web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.name == 'web' && 'web' || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gachavault-${{ matrix.service.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BaHeCeJo/gachavault
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin
            export GHCR_OWNER=$(echo "$GHCR_ACTOR" | tr '[:upper:]' '[:lower:]')
            cd /opt/gachavault

            git pull origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            GHCR_OWNER=$GHCR_OWNER docker compose -f docker-compose.prod.yml pull
            GHCR_OWNER=$GHCR_OWNER docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f
