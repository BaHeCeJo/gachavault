services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gachavault
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: gachavault
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gachavault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    # redis 7 doesn't natively read passwords from files, so we wrap the
    # entrypoint in a tiny shell that exports the file content first.
    command: ["sh", "-c", "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: always
    environment:
      MEILI_MASTER_KEY_FILE: /run/secrets/meilisearch_master_key
      MEILI_ENV: production
    secrets:
      - meilisearch_master_key
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - internal

  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/gachavault-api-gateway:latest
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      PORT: 3000
      RUST_LOG: info
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_URL_FILE: /run/secrets/redis_url
      ALLOWED_ORIGINS: ${FRONTEND_URL}
      AUTH_SERVICE_URL: http://auth-service:3001
      GAMES_SERVICE_URL: http://games-service:3002
      ITEMS_SERVICE_URL: http://items-service:3003
      COLLECTIONS_SERVICE_URL: http://collections-service:3004
      TIERLISTS_SERVICE_URL: http://tierlists-service:3005
      MEDIA_SERVICE_URL: http://media-service:3006
      SEARCH_SERVICE_URL: http://search-service:3007
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3008
    secrets:
      - jwt_secret
      - redis_url
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      games-service:
        condition: service_healthy
      items-service:
        condition: service_healthy
      collections-service:
        condition: service_healthy
      tierlists-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      search-service:
        condition: service_started
    networks:
      - internal
      - external

  # Startup ordering enforces a strict dependency chain so cross-schema FK
  # migrations don't race their referent tables. Each Rust service only
  # responds on its /health port AFTER sqlx::migrate!() completes, so
  # `service_healthy` reliably means "this service's schema is ready":
  #   postgres → games → auth → items → (collections, tierlists)
  # Adds ~30s to a cold start but eliminates a class of broken-deploy bugs.

  games-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-games-service:latest
    restart: always
    environment:
      PORT: 3002
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - database_url
      - jwt_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3002' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-auth-service:latest
    restart: always
    environment:
      PORT: 3001
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRY_SECONDS: 900
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3008
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    secrets:
      - database_url
      - redis_url
      - jwt_secret
      - google_client_secret
      - internal_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3001' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      games-service:
        condition: service_healthy
    networks:
      - internal

  items-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-items-service:latest
    restart: always
    environment:
      PORT: 3003
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SEARCH_SERVICE_URL: http://search-service:3007
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    secrets:
      - database_url
      - jwt_secret
      - internal_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3003' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      games-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - internal

  collections-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-collections-service:latest
    restart: always
    environment:
      PORT: 3004
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - database_url
      - jwt_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3004' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      games-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      items-service:
        condition: service_healthy
    networks:
      - internal

  tierlists-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-tierlists-service:latest
    restart: always
    environment:
      PORT: 3005
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - database_url
      - jwt_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3005' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      games-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      items-service:
        condition: service_healthy
    networks:
      - internal

  media-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-media-service:latest
    restart: always
    environment:
      PORT: 3006
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 20
      PUBLIC_BASE_URL: ${BACKEND_URL}
    secrets:
      - database_url
      - jwt_secret
    volumes:
      - media_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3006' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  search-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-search-service:latest
    restart: always
    environment:
      PORT: 3007
      RUST_LOG: info
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY_FILE: /run/secrets/meilisearch_master_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    secrets:
      - meilisearch_master_key
      - jwt_secret
      - internal_secret
    depends_on:
      - meilisearch
    networks:
      - internal

  notifications-service:
    image: ghcr.io/${GHCR_OWNER}/gachavault-notifications-service:latest
    restart: always
    environment:
      PORT: 3008
      RUST_LOG: info
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      FROM_EMAIL: ${FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    secrets:
      - smtp_password
      - internal_secret
    networks:
      - internal

  web:
    image: ghcr.io/${GHCR_OWNER}/gachavault-web:latest
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # NEXT_PUBLIC_API_URL is what the browser uses (baked into client JS at build).
      # INTERNAL_API_URL is what the Next server uses for SSR / generateMetadata /
      # sitemap fetches — staying on the Docker network avoids a round-trip
      # through public DNS + nginx, which intermittently 404s pages whose data
      # SSR couldn't load in time.
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
      INTERNAL_API_URL: http://api-gateway:3000
      HOSTNAME: "0.0.0.0"
      PORT: 3009
    depends_on:
      - api-gateway
    networks:
      - internal
      - external

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - external
      - internal

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renew every 12h; loud failures (`certbot renew || echo ...`) make it
    # obvious in `docker logs certbot` when a renewal is failing, instead of
    # silently rolling forward to the next attempt.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet || echo \"[certbot] renew FAILED at $$(date -u)\"; sleep 12h & wait $${!}; done;'"
    # Fail the healthcheck if the live cert is within 7 days of expiry. With
    # `restart: unless-stopped` Docker won't restart on unhealthy by itself,
    # but the unhealthy state is visible to `docker compose ps` and any
    # external monitor so it surfaces before the site goes dark.
    healthcheck:
      test:
        - CMD-SHELL
        - "DOMAIN=$$(ls /etc/letsencrypt/live 2>/dev/null | grep -v README | head -1); [ -n \"$$DOMAIN\" ] && openssl x509 -checkend 604800 -noout -in /etc/letsencrypt/live/$$DOMAIN/fullchain.pem"
      interval: 21600s
      timeout: 30s
      retries: 2
      start_period: 300s

  # ── Observability ───────────────────────────────────────────────────────────
  # Loki stores logs; Promtail tails every container's stdout/stderr and ships
  # them to Loki; Grafana queries Loki. All bound to the internal network only
  # — to access Grafana, SSH-tunnel to localhost:3000 from your workstation:
  #   ssh -L 3010:grafana:3000 deploy@VPS
  # then open http://localhost:3010 (admin password lives in
  # /opt/gachavault/secrets/grafana_admin_password).
  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      # Grafana's `<KEY>__FILE` convention reads the secret from disk rather
      # than baking it into the container env — same pattern as the Rust
      # services' read_secret() helper.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal

  db-backup:
    image: postgres:16-alpine
    restart: always
    # The official postgres image's libpq reads PGPASSWORD from env. Source
    # it from the secret file in the entrypoint wrapper before exec'ing the
    # backup script.
    entrypoint: ["/bin/sh", "-c", "export PGPASSWORD=$$(cat /run/secrets/postgres_password); exec /scripts/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: gachavault
      PGDATABASE: gachavault
      KEEP_DAYS: 14
      BACKUP_INTERVAL: 86400
      # Off-site backup target. Leave unset (default) to disable. To enable,
      # set in .env using the {FILE} placeholder — see scripts/db-backup.sh
      # for examples. Common targets: rclone (B2/S3/Hetzner SB), aws s3 cp.
      OFFSITE_UPLOAD_CMD: ${OFFSITE_UPLOAD_CMD:-}
    secrets:
      - postgres_password
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

# Docker secrets are bind-mounted files. On the VPS, populate
# /opt/gachavault/secrets/<name> with the contents (no trailing newline
# needed — read_secret() trims). chmod 600 the files and chown to root
# so only privileged processes can read them. Use the
# scripts/migrate-env-to-secrets.sh helper for the initial import.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  redis_url:
    file: ./secrets/redis_url
  database_url:
    file: ./secrets/database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  internal_secret:
    file: ./secrets/internal_secret
  meilisearch_master_key:
    file: ./secrets/meilisearch_master_key
  google_client_secret:
    file: ./secrets/google_client_secret
  smtp_password:
    file: ./secrets/smtp_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  media_uploads:
  db_backups:
  certbot_www:
  certbot_conf:
  loki_data:
  grafana_data:
  promtail_positions:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
