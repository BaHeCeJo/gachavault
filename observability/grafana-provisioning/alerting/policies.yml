apiVersion: 1

# All alerts route to the `default` contact point. Add specific routes
# (e.g. for sev=critical to a louder channel) by adding entries under
# `routes:` below. Without per-severity routing, this is the simplest
# functional baseline.

policies:
  - orgId: 1
    receiver: default
    group_by: ["grafana_folder", "alertname"]
    # Group alerts that fire close together so a wave of related failures
    # doesn't spam the channel with one notification per rule.
    group_wait: 30s
    group_interval: 5m
    # Re-send the digest every hour while an alert is still firing.
    repeat_interval: 1h
