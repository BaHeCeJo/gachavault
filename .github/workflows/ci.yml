name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Cancel an in-progress CI run when a newer commit is pushed to the same
# ref — no point finishing a build for code that's already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust build & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gachavault
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: gachavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gachavault:cipassword@localhost:5432/gachavault

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run all migrations
        # Globally sort by version prefix (timestamp) and apply with psql.
        # sqlx-cli's per-source `migrate run` was rejecting out-of-order
        # versions across services and was masked by `|| true` — leaving
        # tests to compile against an incomplete schema. All migrations
        # are written with IF NOT EXISTS so direct psql is idempotent.
        run: |
          set -euo pipefail
          for f in $(ls services/*/migrations/*.sql | sort -t/ -k4); do
            echo "==> $f"
            PGPASSWORD=cipassword psql -h localhost -U gachavault -d gachavault -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # NOTE: the standalone `cargo build --workspace --release` step was
      # removed to save CI minutes (it was the slowest single step). Clippy
      # (--all-targets, dev profile) already compiles the whole workspace and
      # catches the vast majority of breakage, and the deploy workflow's
      # per-service Docker build IS a `cargo build --release`, so the release
      # profile is still exercised before anything ships. Trade-off: a
      # release-profile-ONLY break (e.g. an lto/codegen issue) now surfaces at
      # deploy time rather than in CI. Re-add this step if that bites.

      - name: Run tests
        # SQLX_OFFLINE=false so sqlx::test can verify queries against the
        # live CI Postgres (each test gets its own auto-created database).
        env:
          SQLX_OFFLINE: "false"
        run: cargo test --workspace --all-targets

      # Security audits (cargo-audit + npm audit) moved out of the per-push
      # hot path into .github/workflows/security-audit.yml, which runs weekly
      # on a schedule. `cargo install cargo-audit` compiled the tool from
      # source on every CI run (~2–4 min); a dependency advisory does not
      # change between two pushes minutes apart, so per-push was pure waste.

  frontend-check:
    name: Next.js build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # next.config.mjs sets eslint.ignoreDuringBuilds, so the build below
        # does NOT lint — this step is the only thing enforcing it.
        run: npm run lint

      - name: Unit tests
        # vitest + jsdom; no services needed, so this runs before the (slower)
        # build and fails fast on component regressions.
        run: npm test

      - name: Type check & build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        # npm audit moved to .github/workflows/security-audit.yml (weekly).
